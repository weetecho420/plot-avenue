name: Keep database awake

# Supabase free projects pause after ~7 days without activity, which breaks the site.
# Loading the homepage reads the plots table, which counts as activity.
on:
  schedule:
    - cron: "17 3 */2 * *"   # every 2 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://plot-avenue.vercel.app/)
          echo "homepage: $code"
          [ "$code" = "200" ]
